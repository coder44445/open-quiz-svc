# Quiz Service — Standalone Docker Compose
# Use for solo development with its own db + redis.
# For the full platform, use the root /folder/docker-compose.yml instead.

services:

  app:
    build: .
    restart: on-failure
    networks:
      - shared
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@core-infra-db-1:5432/quiz
      REDIS_URL: redis://core-infra-redis-1:6379/3
      OLLAMA_HOST: ${OLLAMA_HOST:-http://172.17.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      PERSONA_BASE_URL: ${PERSONA_BASE_URL:-}
      PERSONA_SERVICE_TOKEN: ${PERSONA_SERVICE_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-quiz-service}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:3000"]'}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
    ports:
      - "${QUIZ_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: .
    entrypoint: ["python", "-m", "arq", "app.ai.worker.WorkerSettings"]
    restart: on-failure
    networks:
      - shared
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@core-infra-db-1:5432/quiz
      REDIS_URL: redis://core-infra-redis-1:6379/3
      OLLAMA_HOST: ${OLLAMA_HOST:-http://172.17.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}

networks:
  shared:
    name: pulse_shared
    external: true
